aid: flatfair
name: flatfair
description: 'flatfair is a UK-based tenancy deposit platform for letting agents, landlords, and Build-to-Rent
  operators, offering deposit alternatives and deposit administration products. Its products include No
  Deposit (tenants pay 28% of one month''s rent plus VAT instead of a five-week cash deposit), Deposits,
  Unlock Deposits, Deposit Boost, tenant Referencing, and Tenant Guarantor. flatfair is used by more than
  850 agents and Build-to-Rent operators to reduce move-in friction and cut deposit administration time
  by around 60 minutes per tenancy. The company operates a web application for agents and tenants but does
  not publish a public developer API, SDK, or developer portal.'
